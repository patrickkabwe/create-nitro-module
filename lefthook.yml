commit-msg:
    commands:
        commitlint:
            run: bun commitlint {1}

pre-commit:
    parallel: true
    commands:
        lint:
            glob:
                - '*.json'
                - '*.ts'
                - '*.tsx'
            run: bun oxfmt --write {staged_files} && bun oxlint --fix --no-error-on-unmatched-pattern {staged_files}

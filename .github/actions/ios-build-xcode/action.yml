name: iOS xcodebuild
description: Build iOS project/scheme with xcpretty
inputs:
    ios-dir:
        description: Path to example/ios directory
        required: true
    scheme:
        description: Xcode scheme to build
        required: false
    mode:
        description: Build configuration (Debug|Release)
        required: true
runs:
    using: composite
    steps:
        - shell: bash
          run: |
              set -euo pipefail
              gem install xcpretty
              cd "${{ inputs.ios-dir }}"

              set -o pipefail

              PROJECT_NAME="$(find . -maxdepth 1 -name '*.xcodeproj' -exec basename {} .xcodeproj \; | head -1)"
              SCHEME_NAME="${{ inputs.scheme }}"

              if [ -z "$PROJECT_NAME" ]; then
                echo "No Xcode project found in ${{ inputs.ios-dir }}"
                exit 1
              fi

              if [ -z "$SCHEME_NAME" ]; then
                SCHEME_NAME="$PROJECT_NAME"
              fi

              echo "Building project ${PROJECT_NAME}.xcodeproj with scheme ${SCHEME_NAME}"

              max_retries=3
              attempt=1

              while [ "$attempt" -le "$max_retries" ]
              do
                echo "xcodebuild attempt $attempt of $max_retries"
                
              if xcodebuild \
                  CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
                  -derivedDataPath build -UseModernBuildSystem=YES \
                  -project "${PROJECT_NAME}.xcodeproj" \
                  -scheme "${SCHEME_NAME}" \
                  -sdk iphonesimulator \
                  -configuration "${{ inputs.mode }}" \
                  build \
                  CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log | xcpretty; then
                  echo "xcodebuild succeeded on attempt $attempt"
                  exit 0
                fi
                
                if [ "$attempt" -eq "$max_retries" ]; then
                  echo "xcodebuild failed after $max_retries attempts"
                  exit 1
                fi
                
                attempt=$((attempt + 1))
                echo "Retrying xcodebuild..."
              done

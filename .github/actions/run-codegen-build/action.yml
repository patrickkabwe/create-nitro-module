name: Run codegen and build
description: Generate Nitro V1 bindings and build the package
inputs:
    pm:
        description: Package manager (bun|yarn|pnpm|npm)
        required: true
    working-directory:
        description: Directory to run in
        required: true
runs:
    using: composite
    steps:
        - shell: bash
          run: |
              set -euo pipefail
              cd "${{ inputs.working-directory }}"
              node --input-type=commonjs <<'NODE'
              const assert = require('node:assert/strict')
              const { devDependencies } = require('./package.json')
              for (const name of ['nitro-core', 'nitrogen', 'react-native-nitro-modules']) {
                const expected = devDependencies[name]
                const { version } = require(`${name}/package.json`)
                assert.equal(version, expected, `${name}: expected ${expected}, installed ${version}`)
                console.log(JSON.stringify({ package: name, expected, installed: version }))
              }
              NODE
              ${{ inputs.pm }} run codegen
